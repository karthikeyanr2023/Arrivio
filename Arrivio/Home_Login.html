<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arrivio Login</title>
  <style>
    :root {
      --primary: #1b3f72;
      --accent: #4db5ff;
      --surface: #ffffff;
      --surface-strong: #f8fbff;
      --text: #12233b;
      --muted: #5b6b86;
      --shadow: 0 28px 70px rgba(22, 48, 89, 0.12);
      --border: rgba(57, 110, 187, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top left, rgba(77, 181, 255, 0.18), transparent 25%),
                  radial-gradient(circle at bottom right, rgba(27, 63, 114, 0.16), transparent 22%),
                  linear-gradient(180deg, #eef6ff 0%, #f8fbff 54%, #f4f8ff 100%);
    }

    body {
      display: grid;
      place-items: center;
      padding: 36px 16px;
    }

    .page-shell {
      width: min(520px, 100%);
      position: relative;
    }

    .hero-card {
      position: relative;
      overflow: hidden;
      border-radius: 32px;
      background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(241,247,255,0.95));
      border: 1px solid rgba(255,255,255,0.9);
      backdrop-filter: blur(18px);
      box-shadow: var(--shadow);
    }

    .hero-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top right, rgba(77, 181, 255, 0.18), transparent 24%),
                  radial-gradient(circle at bottom left, rgba(27, 63, 114, 0.14), transparent 18%);
      pointer-events: none;
    }

    .hero-header {
      position: relative;
      padding: 44px 32px 28px;
      text-align: center;
      z-index: 1;
    }

    .brand-chip {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 18px;
      border-radius: 999px;
      background: rgba(77, 181, 255, 0.14);
      color: var(--primary);
      font-weight: 700;
      margin-bottom: 18px;
      border: 1px solid rgba(77, 181, 255, 0.22);
    }

    .brand-chip span {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 8px rgba(77, 181, 255, 0.08);
    }

    .hero-title {
      margin: 0;
      font-size: clamp(2rem, 4vw, 2.7rem);
      letter-spacing: -0.04em;
      line-height: 1.05;
    }

    .hero-description {
      margin: 16px auto 0;
      max-width: 360px;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.7;
    }

    .login-panel {
      position: relative;
      padding: 32px;
      background: var(--surface);
      border-top: 1px solid rgba(24, 81, 153, 0.06);
      z-index: 1;
    }

    .form-row {
      display: grid;
      gap: 12px;
      margin-bottom: 18px;
    }

    .form-row label {
      display: block;
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .form-row input {
      width: 100%;
      padding: 16px 18px;
      border-radius: 18px;
      border: 1px solid var(--border);
      background: #f8fbff;
      color: var(--text);
      font-size: 1rem;
      transition: border-color 0.25s ease, transform 0.25s ease, background 0.25s ease;
    }

    .form-row input:focus {
      outline: none;
      border-color: var(--accent);
      background: #fff;
      transform: translateY(-1px);
      box-shadow: 0 14px 36px rgba(77, 181, 255, 0.12);
    }

    .login-action {
      display: grid;
      gap: 14px;
      margin-top: 4px;
    }

    .login-action button {
      padding: 16px 18px;
      border: none;
      border-radius: 18px;
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .login-action button:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 32px rgba(14, 86, 170, 0.18);
    }

    .profile-selection {
      display: flex;
      gap: 12px;
      margin-top: 16px;
      justify-content: space-between;
    }
    .profile-option {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 14px;
      background: #fff;
      border: 1px solid rgba(27, 63, 114, 0.06);
      text-decoration: none;
      color: inherit;
      min-width: 0;
      flex: 1;
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }

    .profile-option:hover {
      transform: translateY(-4px);
      box-shadow: 0 18px 36px rgba(18, 67, 120, 0.12);
      border-color: rgba(77, 181, 255, 0.22);
    }

    .profile-option .icon {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 700;
      background: var(--accent);
      flex: 0 0 44px;
    }

    .profile-option .option-label { font-size: 1rem; font-weight: 800; }

    .profile-option .option-note {
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    @media (max-width: 520px) {
      .hero-card {
        border-radius: 28px;
      }

      .hero-header {
        padding: 32px 24px 24px;
      }

      .login-panel {
        padding: 28px 24px 28px;
      }

      .profile-selection {
        grid-template-columns: 1fr;
      }
    }

    .help-text {
      margin-top: 14px;
      color: var(--muted);
      font-size: 0.95rem;
      text-align: center;
    }

    .message {
      display: none;
      margin-bottom: 18px;
      padding: 14px 16px;
      border-radius: 16px;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    @media (max-width: 520px) {
      .hero-card {
        border-radius: 28px;
      }

      .hero-header {
        padding: 32px 24px 24px;
      }

      .login-panel {
        padding: 28px 24px 28px;
      }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <section class="hero-card">
      <div class="hero-header">
        <div class="brand-chip">
          <span></span>
          Arrivio Secure
        </div>
        <h1 class="hero-title">Sign in to Arrivio</h1>
        <p class="hero-description">Access your dashboard, manage projects, and keep your team connected with a secure login experience.</p>
      </div>

      <div class="login-panel">
        <div class="message" id="message"></div>

        <form id="loginForm" autocomplete="off">
          <div class="form-row">
            <label for="username">User Name</label>
            <input type="text" id="username" name="username" placeholder="Enter your user name" autocomplete="username" />
          </div>

          <div class="form-row">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" />
          </div>

          <div class="login-action">
            <button type="submit">Login</button>
          </div>
          <div class="profile-selection">
            <a class="profile-option" href="New_User_Reg.html">
              <div class="icon">U</div>
              <div>
                <div class="option-label">User Profile</div>
              </div>
            </a>
            <a class="profile-option" href="Merchant_Profile.html">
              <div class="icon">M</div>
              <div>
                <div class="option-label">Merchant Profile</div>
              </div>
            </a>
            <a class="profile-option" href="Arrivio_Dashboard.html">
              <div class="icon">A</div>
              <div>
                <div class="option-label">Arrivio</div>
              </div>
            </a>
          </div>
        </form>

        <p class="help-text">Need help? Make sure your username and password are correct, or create a new profile to get started.</p>
      </div>
    </section>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const messageBox = document.getElementById('message');

    // API endpoints for user and merchant lists
    const USER_LIST_URL = 'https://nc17cjkref.execute-api.us-east-1.amazonaws.com/DEV/users';
    const MERCHANT_LIST_URL = 'https://rx6jfxhhfc.execute-api.us-east-1.amazonaws.com/merchants';

    form.addEventListener('submit', async event => {
      event.preventDefault();
      const username = document.getElementById('username').value.trim();

      if (!username) {
        showMessage('Please enter a user name.', true);
        return;
      }

      showMessage('Checking username...', false);

      try {
        // Check users first, then merchants
        const [usersResp, merchantsResp] = await Promise.allSettled([
          fetch(USER_LIST_URL, { headers: { 'Content-Type': 'application/json' } }),
          fetch(MERCHANT_LIST_URL, { headers: { 'Content-Type': 'application/json' } })
        ]);

        let users = [];
        let merchants = [];

        if (usersResp.status === 'fulfilled' && usersResp.value.ok) {
          const j = await usersResp.value.json().catch(() => ({}));
          users = Array.isArray(j.data) ? j.data : [];
        }

        if (merchantsResp.status === 'fulfilled' && merchantsResp.value.ok) {
          const j = await merchantsResp.value.json().catch(() => ({}));
          merchants = Array.isArray(j.data) ? j.data : [];
        }

        const lookup = username.toLowerCase();
        const foundUser = users.find(u => (u.email || '').toLowerCase() === lookup || (u.fullName || '').toLowerCase() === lookup);
        if (foundUser) {
          window.location.href = `Home_Login_Success.html?username=${encodeURIComponent(username)}&type=user`;
          return;
        }

        const foundMerchant = merchants.find(m => (m.email || '').toLowerCase() === lookup || (m.fullName || '').toLowerCase() === lookup);
        if (foundMerchant) {
          window.location.href = `Home_Login_Success.html?username=${encodeURIComponent(username)}&type=merchant`;
          return;
        }

        showMessage('No user or merchant found with that user name.', true);
      } catch (err) {
        console.error(err);
        showMessage('An error occurred while checking username. Try again.', true);
      }
    });

    function showMessage(text, isError) {
      messageBox.textContent = text;
      messageBox.style.display = 'block';
      messageBox.style.background = isError ? '#fdecea' : '#e3f2ff';
      messageBox.style.color = isError ? '#9a1b0b' : '#0a3f61';
    }
  </script>
</body>
</html>
