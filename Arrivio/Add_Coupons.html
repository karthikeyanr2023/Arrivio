<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Add Coupons</title>
  <style>
    :root{--bg:#f6fbff;--card:#fff;--muted:#5b6b86;--accent:#1b6bd6;--surface:#f8fbff;--success:#1e7f4b}
    *{box-sizing:border-box} body{margin:0;font-family:Inter,Segoe UI,system-ui,Arial;background:var(--bg);color:#102a44}
    .wrap{max-width:900px;margin:24px auto;padding:20px}
    .card{background:var(--card);border:1px solid rgba(16,42,68,0.06);border-radius:16px;padding:22px;box-shadow:0 8px 20px rgba(16,42,68,0.04)}
    h2{margin:0 0 8px;font-size:1.5rem} .sub{color:var(--muted);margin-bottom:18px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .field{display:flex;flex-direction:column;gap:6px}
    label{font-weight:700;color:var(--muted);font-size:0.9rem}
    input, select, textarea{width:100%;padding:10px 12px;border:1px solid rgba(16,42,68,0.12);border-radius:10px;background:#fff;font:inherit;color:#102a44}
    textarea{min-height:110px;resize:vertical}
    .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
    button{padding:11px 18px;border-radius:10px;border:0;cursor:pointer;font-weight:700}
    .save{background:var(--accent);color:#fff}
    .cancel{background:#eef5ff;color:var(--accent)}
    .state-box{margin-top:16px;padding:14px;border-radius:10px;background:var(--surface)}
    .state-box strong{display:block;margin-bottom:6px}
    @media (max-width:700px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h2>Add Coupon</h2>
      <div class="sub">Create a coupon for the selected merchant audience.</div>

      <div class="grid">
        <div class="field">
          <label for="couponTitle">Coupon title</label>
          <input id="couponTitle" type="text" placeholder="e.g. 20% Off" />
        </div>
        <div class="field">
          <label for="couponType">Coupon type</label>
          <select id="couponType">
            <option value="">Select type</option>
            <option>Percent off</option>
            <option>Flat discount</option>
            <option>Free shipping</option>
            <option>Buy one get one</option>
          </select>
        </div>
        <div class="field">
          <label for="couponFrom">From</label>
          <input id="couponFrom" type="date" />
        </div>
        <div class="field">
          <label for="couponTo">To</label>
          <input id="couponTo" type="date" />
        </div>
        <div class="field" style="grid-column:1 / -1;">
          <label for="couponAddress">Applicable address</label>
          <input id="couponAddress" type="text" placeholder="e.g. 210 Harbor Avenue" />
        </div>
        <div class="field">
          <label for="couponCity">City</label>
          <input id="couponCity" type="text" placeholder="e.g. Seattle" />
        </div>
        <div class="field">
          <label for="couponPin">PIN / ZIP code</label>
          <input id="couponPin" type="text" placeholder="e.g. 98101" />
        </div>
        <div class="field">
          <label for="couponState">State</label>
          <select id="couponState"></select>
        </div>
        <div class="field" style="grid-column:1 / -1;">
          <label for="couponDetails">Coupon details</label>
          <textarea id="couponDetails" placeholder="Add discount terms, usage notes, and restrictions"></textarea>
        </div>
        <div class="field">
          <label for="couponAgeLimit">Age limit</label>
          <input id="couponAgeLimit" type="number" min="0" placeholder="e.g. 21" />
        </div>
      </div>

      <div class="state-box">
        <strong>Merchant location logic</strong>
        <div id="couponStateNote">State list will be populated based on your merchant location.</div>
      </div>

      <div class="actions">
        <button class="cancel" type="button" onclick="window.close()">Cancel</button>
        <button class="save" type="button" id="saveCouponBtn">Save</button>
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const merchantState = params.get('merchantState') || '';
    const allStates = [
      'Alabama','Alaska','Arizona','Arkansas','California','Colorado','Connecticut','Delaware','Florida','Georgia','Hawaii','Idaho','Illinois','Indiana','Iowa','Kansas','Kentucky','Louisiana','Maine','Maryland','Massachusetts','Michigan','Minnesota','Mississippi','Missouri','Montana','Nebraska','Nevada','New Hampshire','New Jersey','New Mexico','New York','North Carolina','North Dakota','Ohio','Oklahoma','Oregon','Pennsylvania','Rhode Island','South Carolina','South Dakota','Tennessee','Texas','Utah','Vermont','Virginia','Washington','West Virginia','Wisconsin','Wyoming'
    ];

    const stateSelect = document.getElementById('couponState');
    const stateNote = document.getElementById('couponStateNote');

    function populateStates() {
      const selected = merchantState && allStates.includes(merchantState) ? merchantState : allStates[0];
      stateSelect.innerHTML = allStates.map(s => `<option value="${s}" ${s === selected ? 'selected' : ''}>${s}</option>`).join('');
      stateNote.textContent = merchantState ? `Merchant location detected: ${merchantState}. Matching state options were loaded.` : 'No merchant state detected; using default state list.';
    }

    document.getElementById('saveCouponBtn').addEventListener('click', async () => {
      const payload = {
        merchantId: 'merchant-123',
        title: document.getElementById('couponTitle').value.trim(),
        type: document.getElementById('couponType').value,
        from: document.getElementById('couponFrom').value,
        to: document.getElementById('couponTo').value,
        address: document.getElementById('couponAddress').value.trim(),
        city: document.getElementById('couponCity').value.trim(),
        pin: document.getElementById('couponPin').value.trim(),
        details: document.getElementById('couponDetails').value.trim(),
        ageLimit: document.getElementById('couponAgeLimit').value,
        state: stateSelect.value
      };

      if (!payload.title || !payload.from || !payload.to || !payload.address || !payload.city || !payload.pin || !payload.state || !payload.details) {
        alert('Please complete the coupon title, dates, applicable address, city, PIN, state, and coupon details before saving.');
        return;
      }

      try {
        const response = await fetch('https://bzv39kd4g2.execute-api.us-east-1.amazonaws.com/coupons', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        const result = await response.json();
        console.log('Coupon saved successfully:', result);
        alert('Coupon saved successfully.');
        window.close();
      } catch (error) {
        console.error('Error saving coupon:', error);
        alert('There was an error saving the coupon.');
      }
    });

    populateStates();
  </script>
</body>
</html>
